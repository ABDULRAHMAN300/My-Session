<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جدول الحصص الأسبوعي</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="جدول الحصص">
<meta name="theme-color" content="#FCF9FB">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#38323F;
    --heading:#493463;
    --accent:#C998B2;
    --bg:#FCF9FB;
    --panel:#EEEAF2;
    --line:#DFD7E6;
    --muted:#6F6579;
    --danger:#9B3B47;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Kufi Arabic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;
    line-height:1.7;
    direction:rtl;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}

  header h1{
    font-size:24px;
    font-weight:700;
    color:var(--heading);
    margin:0 0 4px;
    letter-spacing:-.2px;
  }
  header p{margin:0;color:var(--muted);font-size:13px}

  /* شريط الإحصائية */
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:18px 0 14px;
  }
  .stat{
    background:var(--panel);
    border-radius:14px;
    padding:12px 10px;
    text-align:center;
  }
  .stat b{display:block;font-size:20px;color:var(--heading);font-weight:700;line-height:1.3}
  .stat span{font-size:12px;color:var(--muted)}
  .split{
    display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
    font-size:13px;color:var(--muted);margin-bottom:18px
  }
  .split i{font-style:normal;color:var(--heading);font-weight:600}

  /* أزرار وحقول */
  button{font-family:inherit;font-size:14px;cursor:pointer;border:none;border-radius:12px}
  .primary{
    background:var(--heading);color:#fff;padding:12px 18px;font-weight:600;width:100%;
  }
  .primary:hover{background:#3c2a55}
  .ghost{
    background:transparent;color:var(--heading);border:1px solid var(--line);
    padding:11px 16px;font-weight:500;
  }
  :focus-visible{outline:2px solid var(--heading);outline-offset:2px}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:16px;margin-bottom:18px;
  }
  .card h2{margin:0 0 12px;font-size:16px;color:var(--heading);font-weight:600}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  input[type=text],input[type=time],select{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;
    background:var(--bg);color:var(--ink);font-family:inherit;font-size:15px;
  }
  input[type=time]{direction:ltr;text-align:right}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}

  .swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
  .sw[aria-pressed="true"]{border-color:var(--ink)}
  input[type=color]{
    width:34px;height:34px;padding:0;border:1px solid var(--line);
    border-radius:50%;background:none;cursor:pointer;overflow:hidden;
  }

  .msg{font-size:13px;color:var(--danger);margin:0 0 10px;display:none}
  .msg.on{display:block}

  /* شرائح الأيام */
  .days{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;-webkit-overflow-scrolling:touch}
  .days::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap;background:#fff;border:1px solid var(--line);
    color:var(--ink);padding:8px 13px;font-size:13.5px;border-radius:999px;
  }
  .chip[aria-pressed="true"]{background:var(--heading);border-color:var(--heading);color:#fff}
  .chip u{text-decoration:none;opacity:.65;font-size:12px;margin-inline-start:4px}

  /* أقسام الأيام */
  .day{margin-bottom:22px}
  .day h3{
    font-size:14px;font-weight:600;color:var(--heading);margin:0 0 8px;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .day h3 span{font-size:12px;color:var(--muted);font-weight:400}

  .lesson{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:8px;
    border-inline-start:5px solid var(--accent);
  }
  .lesson .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .lesson .name{font-weight:600;font-size:15px}
  .lesson .time{font-size:13px;color:var(--muted);direction:ltr}
  .lesson .meta{font-size:13px;color:var(--muted);margin-top:2px}
  .lesson .acts{display:flex;gap:14px;margin-top:8px}
  .lesson .acts button{
    background:none;padding:0;font-size:13px;color:var(--heading);
    border-bottom:1px solid var(--line);border-radius:0;
  }
  .lesson .acts .del{color:var(--danger)}

  .lesson.has-clash{background:#FDF6F7}
  .clash{
    margin-top:8px;font-size:12.5px;color:var(--danger);
    background:#F7ECEE;border-radius:9px;padding:6px 9px;
  }

  details.backup{margin-top:6px}
  details.backup summary{
    cursor:pointer;font-size:13.5px;color:var(--heading);
    list-style:none;padding:4px 0;
  }
  details.backup summary::-webkit-details-marker{display:none}
  textarea{
    width:100%;min-height:90px;margin-top:10px;padding:10px;
    border:1px solid var(--line);border-radius:12px;background:var(--bg);
    font-family:ui-monospace,monospace;font-size:12px;direction:ltr;
  }
  .m-row{
    border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;
  }
  .m-row .who{font-weight:600;font-size:14.5px;margin-bottom:8px}
  .m-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .m-grid div{background:var(--panel);border-radius:10px;padding:7px 4px}
  .m-grid b{display:block;font-size:15px;color:var(--heading);font-weight:600;direction:ltr}
  .m-grid span{font-size:11.5px;color:var(--muted)}
  .m-grid .owed b{color:var(--danger)}
  .m-grid .clear b{color:#3F6B46}
  .m-pay{display:flex;align-items:center;gap:8px;margin-top:8px}
  .m-pay label{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .m-pay input{padding:8px 10px;font-size:14px;direction:ltr;text-align:right}
  .m-total{
    background:var(--panel);border-radius:14px;padding:11px 13px;margin-top:10px;
    font-size:13.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }
  .m-total i{font-style:normal;color:var(--heading);font-weight:600;direction:ltr}
  .empty{
    background:var(--panel);border-radius:14px;padding:14px;
    font-size:13.5px;color:var(--muted);text-align:center;
  }
  .loading{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
</style>

<div class="wrap">
  <header>
    <h1>جدول الحصص</h1>
    <p>من السبت إلى الجمعة · يُحفظ تلقائيًا في هذا المتصفح</p>
  </header>

  <div class="stats">
    <div class="stat"><b id="s-count">0</b><span>حصة</span></div>
    <div class="stat"><b id="s-hours">0</b><span>ساعة</span></div>
    <div class="stat"><b id="s-days">0</b><span>يوم فيه حصص</span></div>
  </div>
  <div class="split">
    <span>كيمياء <i id="s-chem">0</i></span>
    <span>فيزياء <i id="s-phys">0</i></span>
    <span>الصف 10 <i id="s-g10">0</i> · 11 <i id="s-g11">0</i> · 12 <i id="s-g12">0</i></span>
  </div>

  <div class="card">
    <h2 id="form-title">إضافة حصة</h2>
    <p class="msg" id="msg"></p>

    <div class="field">
      <label for="f-name">اسم الطالب</label>
      <input type="text" id="f-name" placeholder="مثال: محمد العتيبي" autocomplete="off">
    </div>

    <div class="row">
      <div class="field">
        <label for="f-subject">المادة</label>
        <select id="f-subject">
          <option value="كيمياء">كيمياء</option>
          <option value="فيزياء">فيزياء</option>
        </select>
      </div>
      <div class="field">
        <label for="f-grade">الصف</label>
        <select id="f-grade">
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="f-day">اليوم</label>
      <select id="f-day"></select>
    </div>

    <div class="row">
      <div class="field">
        <label for="f-from">من</label>
        <input type="time" id="f-from" value="16:00">
      </div>
      <div class="field">
        <label for="f-to">إلى</label>
        <input type="time" id="f-to" value="17:00">
      </div>
    </div>

    <div class="field">
      <label>لون الحصة</label>
      <div class="swatches" id="swatches"></div>
    </div>

    <button class="primary" id="save">إضافة الحصة</button>
    <button class="ghost" id="cancel" style="width:100%;margin-top:8px;display:none">إلغاء التعديل</button>
  </div>

  <div class="card">
    <h2>الحسابات (د.ك)</h2>
    <div class="field" style="margin-bottom:14px">
      <label for="f-price">سعر الحصة الموحّد</label>
      <input type="number" id="f-price" inputmode="decimal" min="0" step="0.5" value="0">
    </div>
    <div id="money"></div>
  </div>

  <div class="card">
    <details class="backup">
      <summary>نسخة احتياطية للنقل إلى جهاز آخر</summary>
      <p style="font-size:13px;color:var(--muted);margin:8px 0 0">
        اضغط «تصدير» لتظهر بياناتك كنص، انسخه، ثم الصقه هنا في الجهاز الآخر واضغط «استيراد».
      </p>
      <textarea id="backup" placeholder="الصق نص النسخة هنا للاستيراد"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="ghost" id="export">تصدير</button>
        <button class="ghost" id="import">استيراد</button>
      </div>
    </details>
  </div>

  <div class="days" id="days"></div>
  <div id="list"><div class="loading">جارٍ تحميل الحصص…</div></div>
</div>

<script>
const DAYS = ["السبت","الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة"];
const COLORS = ["#493463","#4A6FA5","#C998B2","#A34E5E","#4E7A54","#8A5A83"];
const KEY = "lessons:v1";

let lessons = [];
let editingId = null;
let filter = "all";
let color = COLORS[0];

const $ = id => document.getElementById(id);

/* ===== أدوات ===== */
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
function fmtTime(t){
  const [h,m] = t.split(":").map(Number);
  return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
}
function overlap(a,b){
  return a.day === b.day && toMin(a.from) < toMin(b.to) && toMin(b.from) < toMin(a.to);
}
function clashes(l){
  return lessons.filter(x => x.id !== l.id && overlap(x,l));
}
function fmtDur(min){
  const h = Math.floor(min/60), m = min%60;
  if (h && m) return h + " س " + m + " د";
  if (h) return h + " س";
  return m + " د";
}


/* ===== التخزين: ذاكرة المتصفح فقط، بلا تسجيل دخول ===== */
const store = {
  get(){ return localStorage.getItem(KEY); },
  set(v){ localStorage.setItem(KEY, v); }
};

let price = 0;
let payments = {};

function load(){
  try{
    const raw = store.get();
    lessons = raw ? JSON.parse(raw) : [];
  }catch(e){
    lessons = [];
  }
  try{
    price = Number(localStorage.getItem(KEY + ":price")) || 0;
    payments = JSON.parse(localStorage.getItem(KEY + ":pay") || "{}");
  }catch(e){
    price = 0; payments = {};
  }
  $("f-price").value = price;
  render();
}
function persist(){
  try{
    store.set(JSON.stringify(lessons));
    localStorage.setItem(KEY + ":price", String(price));
    localStorage.setItem(KEY + ":pay", JSON.stringify(payments));
  }catch(e){
    showMsg("تعذّر الحفظ في هذا المتصفح. تأكد أن التصفح ليس خاصًا، واحتفظ بنسخة عبر زر التصدير.");
  }
}

const kd = n => (Math.round(n * 1000) / 1000).toFixed(3);

$("f-price").onchange = e => {
  price = Math.max(0, Number(e.target.value) || 0);
  e.target.value = price;
  renderMoney();
  persist();
};

function renderMoney(){
  const box = $("money");
  box.innerHTML = "";
  const names = [];
  lessons.forEach(l => { if (!names.includes(l.name)) names.push(l.name); });

  if (!names.length){
    box.innerHTML = '<div class="empty">أضف حصصًا ليظهر حساب كل طالب.</div>';
    return;
  }

  let tDue = 0, tPaid = 0;

  names.forEach(name => {
    const n = lessons.filter(l => l.name === name).length;
    const due = n * price;
    const paid = Number(payments[name]) || 0;
    const rest = due - paid;
    tDue += due; tPaid += paid;

    const row = document.createElement("div");
    row.className = "m-row";

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = name;

    const grid = document.createElement("div");
    grid.className = "m-grid";
    grid.innerHTML =
      '<div><b>' + n + '</b><span>عدد الحصص</span></div>' +
      '<div><b>' + kd(due) + '</b><span>المستحق</span></div>' +
      '<div class="' + (rest > 0.0005 ? "owed" : "clear") + '"><b>' + kd(rest) + '</b><span>المتبقي</span></div>';

    const pay = document.createElement("div");
    pay.className = "m-pay";
    const lab = document.createElement("label");
    lab.textContent = "المدفوع";
    const inp = document.createElement("input");
    inp.type = "number";
    inp.inputMode = "decimal";
    inp.min = "0";
    inp.step = "0.5";
    inp.value = paid;
    inp.onchange = () => {
      payments[name] = Math.max(0, Number(inp.value) || 0);
      renderMoney();
      persist();
    };
    pay.append(lab, inp);

    row.append(who, grid, pay);
    box.appendChild(row);
  });

  const tot = document.createElement("div");
  tot.className = "m-total";
  tot.innerHTML =
    "<span>المستحق <i>" + kd(tDue) + "</i></span>" +
    "<span>المدفوع <i>" + kd(tPaid) + "</i></span>" +
    "<span>المتبقي <i>" + kd(tDue - tPaid) + "</i></span>";
  box.appendChild(tot);
}

function showMsg(text){
  const m = $("msg");
  m.textContent = text;
  m.classList.toggle("on", !!text);
}

/* ===== بناء عناصر النموذج ===== */
DAYS.forEach((d,i) => {
  const o = document.createElement("option");
  o.value = i; o.textContent = d;
  $("f-day").appendChild(o);
});

COLORS.forEach(c => {
  const b = document.createElement("button");
  b.className = "sw";
  b.style.background = c;
  b.setAttribute("aria-label", "لون");
  b.setAttribute("aria-pressed", c === color);
  b.onclick = () => { color = c; syncSwatches(); };
  $("swatches").appendChild(b);
});
const custom = document.createElement("input");
custom.type = "color";
custom.value = COLORS[0];
custom.setAttribute("aria-label","لون مخصص");
custom.oninput = e => { color = e.target.value; syncSwatches(); };
$("swatches").appendChild(custom);

function syncSwatches(){
  document.querySelectorAll(".sw").forEach((b,i) =>
    b.setAttribute("aria-pressed", COLORS[i] === color));
}

$("f-subject").onchange = e => {
  if (editingId) return;
  color = e.target.value === "فيزياء" ? COLORS[1] : COLORS[0];
  custom.value = color;
  syncSwatches();
};

/* ===== الحفظ والتعديل ===== */
$("save").onclick = async () => {
  const name = $("f-name").value.trim();
  const from = $("f-from").value;
  const to = $("f-to").value;

  if (!name) return showMsg("اكتب اسم الطالب أولًا.");
  if (!from || !to) return showMsg("حدّد وقت البداية والنهاية.");
  if (toMin(to) <= toMin(from)) return showMsg("وقت النهاية يجب أن يكون بعد وقت البداية.");
  showMsg("");

  const data = {
    name,
    subject: $("f-subject").value,
    grade: $("f-grade").value,
    day: Number($("f-day").value),
    from, to, color
  };

  data.id = editingId || ("l" + Date.now() + Math.floor(Math.random()*1000));
  const clash = clashes(data);
  if (clash.length){
    const c = clash[0];
    const ok = confirm(
      "تعارض في " + DAYS[data.day] + ": حصة " + c.name +
      " من " + fmtTime(c.from) + " إلى " + fmtTime(c.to) + ".\nهل تريد الحفظ رغم ذلك؟"
    );
    if (!ok) return;
  }

  if (editingId){
    const i = lessons.findIndex(l => l.id === editingId);
    const old = i > -1 ? lessons[i].name : null;
    if (old && old !== name && payments[old] !== undefined){
      const stillUsed = lessons.some(l => l.id !== editingId && l.name === old);
      if (!stillUsed){
        payments[name] = (Number(payments[name]) || 0) + Number(payments[old]);
        delete payments[old];
      }
    }
    if (i > -1) lessons[i] = Object.assign({}, lessons[i], data);
    editingId = null;
  } else {
    lessons.push(data);
  }

  resetForm();
  render();
  persist();
};

$("cancel").onclick = () => { editingId = null; showMsg(""); resetForm(); };

function resetForm(){
  $("f-name").value = "";
  $("form-title").textContent = "إضافة حصة";
  $("save").textContent = "إضافة الحصة";
  $("cancel").style.display = "none";
}

function startEdit(id){
  const l = lessons.find(x => x.id === id);
  if (!l) return;
  editingId = id;
  $("f-name").value = l.name;
  $("f-subject").value = l.subject;
  $("f-grade").value = l.grade;
  $("f-day").value = l.day;
  $("f-from").value = l.from;
  $("f-to").value = l.to;
  color = l.color; custom.value = l.color; syncSwatches();
  $("form-title").textContent = "تعديل حصة";
  $("save").textContent = "حفظ التعديل";
  $("cancel").style.display = "block";
  showMsg("");
  window.scrollTo({ top:0, behavior:"smooth" });
}

async function remove(id){
  const l = lessons.find(x => x.id === id);
  if (!confirm("حذف حصة " + l.name + "؟")) return;
  lessons = lessons.filter(x => x.id !== id);
  if (editingId === id){ editingId = null; resetForm(); }
  render();
  persist();
}

/* ===== العرض ===== */
function render(){
  renderMoney();
  const scope = filter === "all" ? lessons : lessons.filter(l => l.day === filter);
  const mins = scope.reduce((s,l) => s + (toMin(l.to) - toMin(l.from)), 0);

  $("s-count").textContent = scope.length;
  $("s-hours").textContent = (mins/60).toFixed(mins % 60 ? 1 : 0);
  $("s-days").textContent = new Set(scope.map(l => l.day)).size;
  $("s-chem").textContent = scope.filter(l => l.subject === "كيمياء").length;
  $("s-phys").textContent = scope.filter(l => l.subject === "فيزياء").length;
  $("s-g10").textContent = scope.filter(l => l.grade === "10").length;
  $("s-g11").textContent = scope.filter(l => l.grade === "11").length;
  $("s-g12").textContent = scope.filter(l => l.grade === "12").length;

  // شرائح الأيام
  const days = $("days");
  days.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip";
  all.setAttribute("aria-pressed", filter === "all");
  all.innerHTML = "كل الأسبوع <u>" + lessons.length + "</u>";
  all.onclick = () => { filter = "all"; render(); };
  days.appendChild(all);

  DAYS.forEach((d,i) => {
    const n = lessons.filter(l => l.day === i).length;
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", filter === i);
    b.innerHTML = d + (n ? " <u>" + n + "</u>" : "");
    b.onclick = () => { filter = i; render(); };
    days.appendChild(b);
  });

  // القائمة
  const list = $("list");
  list.innerHTML = "";
  const shown = filter === "all" ? DAYS.map((_,i) => i) : [filter];

  if (!scope.length){
    list.innerHTML = '<div class="empty">لا توجد حصص هنا بعد. أضف أول حصة من النموذج بالأعلى.</div>';
    return;
  }

  shown.forEach(i => {
    const items = lessons.filter(l => l.day === i).sort((a,b) => toMin(a.from) - toMin(b.from));
    if (!items.length) return;

    const dayMin = items.reduce((s,l) => s + (toMin(l.to) - toMin(l.from)), 0);
    const sec = document.createElement("section");
    sec.className = "day";
    sec.innerHTML = "<h3>" + DAYS[i] + "<span>" + items.length + " حصة · " + fmtDur(dayMin) + "</span></h3>";

    items.forEach(l => {
      const dur = toMin(l.to) - toMin(l.from);
      const el = document.createElement("article");
      el.className = "lesson";
      el.style.borderInlineStartColor = l.color;

      const top = document.createElement("div");
      top.className = "top";
      const nm = document.createElement("div");
      nm.className = "name";
      nm.textContent = l.name;
      const tm = document.createElement("div");
      tm.className = "time";
      tm.textContent = fmtTime(l.from) + " – " + fmtTime(l.to);
      top.append(nm, tm);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = l.subject + " · الصف " + l.grade + " · " + fmtDur(dur);

      const cl = clashes(l);
      let warn = null;
      if (cl.length){
        el.classList.add("has-clash");
        warn = document.createElement("div");
        warn.className = "clash";
        warn.textContent = "يتعارض مع: " + cl.map(c => c.name + " " + fmtTime(c.from) + "–" + fmtTime(c.to)).join("، ");
      }

      const acts = document.createElement("div");
      acts.className = "acts";
      const e = document.createElement("button");
      e.textContent = "تعديل";
      e.onclick = () => startEdit(l.id);
      const d = document.createElement("button");
      d.className = "del";
      d.textContent = "حذف";
      d.onclick = () => remove(l.id);
      acts.append(e, d);

      el.append(top, meta);
      if (warn) el.appendChild(warn);
      el.appendChild(acts);
      sec.appendChild(el);
    });

    list.appendChild(sec);
  });
}

/* ===== نسخة احتياطية ===== */
$("export").onclick = () => {
  const t = $("backup");
  t.value = JSON.stringify({ lessons, price, payments });
  t.select();
};

$("import").onclick = () => {
  const raw = $("backup").value.trim();
  if (!raw) return alert("الصق نص النسخة أولًا.");
  let data;
  try{ data = JSON.parse(raw); }catch(e){ return alert("النص غير صالح. انسخ النسخة كاملة وحاول مرة أخرى."); }

  const incoming = Array.isArray(data) ? data : data.lessons;
  if (!Array.isArray(incoming)) return alert("النص غير صالح. انسخ النسخة كاملة وحاول مرة أخرى.");

  const existing = new Set(lessons.map(l => l.id));
  const added = incoming.filter(l => l && l.id && !existing.has(l.id));
  lessons = lessons.concat(added);

  if (!Array.isArray(data)){
    if (typeof data.price === "number" && !price){ price = data.price; $("f-price").value = price; }
    if (data.payments) Object.keys(data.payments).forEach(k => {
      if (payments[k] === undefined) payments[k] = data.payments[k];
    });
  }

  render();
  persist();
  alert("تم استيراد " + added.length + " حصة.");
};

load();
