/* ============ تذكير النسخة الاحتياطية ============ */
const BK_LAST = "hisas_bk_last", BK_SNOOZE = "hisas_bk_snooze";
const dayNum = ds => Math.floor(parse(ds).getTime()/86400000);
function markBackup(){ try{ localStorage.setItem(BK_LAST, TODAY); localStorage.removeItem(BK_SNOOZE); }catch(e){} paintBkBar(); }
function bkDue(){
  if(!lessons.length) return null;
  let last = null, snz = null;
  try{ last = localStorage.getItem(BK_LAST); snz = localStorage.getItem(BK_SNOOZE); }catch(e){}
  if(snz && dayNum(TODAY) < dayNum(snz)) return null;
  if(!last) return {days:null};
  const d = dayNum(TODAY) - dayNum(last);
  return d >= 7 ? {days:d} : null;
}
function paintBkBar(){
  const el = document.getElementById("bkbar"); if(!el) return;
  const due = bkDue();
  el.hidden = !due;
  if(!due) return;
  el.innerHTML = `<p>🛟 <b>خذ نسخة احتياطية.</b> ${due.days===null
      ? "لم تأخذ نسخة من قبل، والبيانات محفوظة في هذا الجهاز فقط."
      : `آخر نسخة قبل <span class="num">${due.days}</span> يومًا.`}</p>
    <button class="minibtn solid" type="button" id="bk-now">نسخة الآن</button>
    <button class="minibtn" type="button" id="bk-later">لاحقًا</button>`;
  document.getElementById("bk-later").onclick = ()=>{
    try{ localStorage.setItem(BK_SNOOZE, key(addDays(new Date(), 3))); }catch(e){}
    paintBkBar();
  };
  document.getElementById("bk-now").onclick = saveBackupFile;
}
async function saveBackupFile(){
  const name = "hisas-" + TODAY + ".json";
  const text = backupBlob();
  try{
    const file = new File([text], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"نسخة احتياطية"});
      markBackup();
      return;
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  try{
    const url = URL.createObjectURL(new Blob([text], {type:"application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    markBackup();
  }catch(e){ alert("تعذّر حفظ النسخة في هذا المتصفح."); }
}

/* ============ التذكير قبل الحصة ============ */
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const inTxt = m => { if(m<60) return m + " د"; const h = Math.floor(m/60), r = m%60; return h + " س" + (r ? " " + r + " د" : ""); };
function nextInfo(){
  const nm = nowMin();
  const today = lessonsOn(TODAY).filter(l=>!l.done && !l._st);
  const cur = today.find(l=>mins(l.from)<=nm && mins(l.to)>nm);
  if(cur) return {l:cur, kind:"now", left:mins(cur.to)-nm};
  const nx = today.find(l=>mins(l.from)>nm);
  if(nx) return {l:nx, kind:"soon", left:mins(nx.from)-nm};
  const t = lessonsOn(key(addDays(new Date(),1))).filter(l=>!l._st)[0];
  return t ? {l:t, kind:"tmr"} : null;
}
function heroHTML(){
  const h = new Date().getHours();
  const hi = h < 12 ? "صباح الخير" : "مساء الخير";
  const list = lessonsOn(TODAY).filter(l=>!l._st);
  const doneN = list.filter(l=>l.done).length;
  const nx = nextInfo();
  const who = l => esc(l.student||"بدون اسم");
  let line;
  if(!nx) line = `<b>لا حصص قادمة</b><span>لا شيء مجدول لليوم أو الغد.</span>`;
  else if(nx.kind==="now") line = `<b>الآن: ${who(nx.l)}</b><span>${subjOf(nx.l.subj).l} · تنتهي بعد ${inTxt(nx.left)}</span>`;
  else if(nx.kind==="soon") line = `<b>التالية: ${who(nx.l)} · ${fmtT(nx.l.from)}</b><span>${subjOf(nx.l.subj).l} · بعد ${inTxt(nx.left)}</span>`;
  else line = `<b>غدًا: ${who(nx.l)} · ${fmtT(nx.l.from)}</b><span>${subjOf(nx.l.subj).l} · أول حصة غدًا</span>`;
  const urgent = nx && (nx.kind==="now" || (nx.kind==="soon" && nx.left<=30));
  return `<section class="hero${urgent?" urgent":""}" id="hero">
    <div class="hero-top"><span>${hi}</span>${list.length?`<span class="hero-count num">${doneN} / ${list.length} اليوم</span>`:""}</div>
    <div class="hero-next">${line}</div>
    ${list.length?`<div class="hero-bar"><i style="width:${Math.round(doneN*100/list.length)}%"></i></div>`:""}
  </section>`;
}
function updateRemind(){
  const el = document.getElementById("remind"); if(!el) return;
  const nx = nextInfo();
  const show = state.tab!=="cal" && nx && (nx.kind==="now" || (nx.kind==="soon" && nx.left<=30));
  el.hidden = !show;
  if(show) el.innerHTML = nx.kind==="now"
    ? `⏱ الآن: <b>${esc(nx.l.student||"بدون اسم")}</b> · تنتهي بعد ${inTxt(nx.left)}`
    : `🔔 بعد ${inTxt(nx.left)}: <b>${esc(nx.l.student||"بدون اسم")}</b> · ${fmtT(nx.l.from)}`;
}
function tick(){
  const nowKey = key(new Date());
  if(nowKey !== TODAY){
    /* تغيّر اليوم واللوحة مفتوحة (مثلًا تُركت مفتوحة من الأمس) — أعِد بناء الشاشة كاملة */
    TODAY = nowKey;
    render();
    return;
  }
  updateRemind();
  const h = document.getElementById("hero");
  if(h) h.outerHTML = heroHTML();
  paintBadge();
}
setInterval(tick, 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) tick(); });

/* ============ نافذة الحصة ============ */
const scrim = document.getElementById("scrim");
let draft = {grade:"10", subj:"chem", rep:{t:"none",d:[],until:""}, dur:90};

function optButtons(el, items, cur, cb){
  el.innerHTML = items.map(it=>`<button class="opt" type="button" data-v="${it.v}" aria-pressed="${it.v===cur}">${it.dot?`<i style="background:${it.dot}"></i>`:""}${it.l}</button>`).join("");
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>cb(b.dataset.v));
}
function paintOpts(){
  optButtons(document.getElementById("f-grade"), GRADES.map(g=>({v:g.v,l:g.l,dot:g.c})), draft.grade,
    v=>{ draft.grade=v; if(!subjAllowed(draft.subj, v)) draft.subj="chem"; paintOpts(); });
  optButtons(document.getElementById("f-subj"),
    SUBJECTS.filter(s=>subjAllowed(s.v, draft.grade)).map(s=>({v:s.v,l:s.l,dot:s.c})), draft.subj,
    v=>{ draft.subj=v; paintOpts(); });
  optButtons(document.getElementById("f-rep"), REPEATS.map(r=>({v:r.v,l:r.l})), draft.rep.t,
    v=>{
      draft.rep.t=v;
      if(v==="weekly" && !draft.rep.d.length){
        const ds = document.getElementById("f-date").value || state.sel;
        draft.rep.d = [parse(ds).getDay()];
      }
      paintOpts();
    });
  const box = document.getElementById("f-rep-days");
  box.hidden = draft.rep.t !== "weekly";
  if(!box.hidden){
    box.innerHTML = DAYS_S.map((d,i)=>`<button class="opt" type="button" data-d="${i}" aria-pressed="${draft.rep.d.includes(i)}">${d}</button>`).join("");
    box.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.d;
      draft.rep.d = draft.rep.d.includes(i) ? draft.rep.d.filter(x=>x!==i) : draft.rep.d.concat(i);
      paintOpts();
    });
  }
  document.getElementById("f-rep-until").hidden = draft.rep.t === "none";
  document.getElementById("f-until").value = draft.rep.until || "";
  optButtons(document.getElementById("f-dur"),
    [{v:60,l:"ساعة"},{v:90,l:"ساعة ونصف"},{v:120,l:"ساعتان"}], draft.dur,
    v=>{ draft.dur=+v; paintOpts(); });
}
function openSheet(les, date, occDate){
  state.editing = les ? les.id : null;
  state.occDate = occDate || (les ? les.date : null);
  draft = {
    grade: les ? (les.grade||"10") : draft.grade,
    subj:  les ? (les.subj||"chem") : draft.subj,
    rep:   les && les.rep ? {t:les.rep.t||"none", d:(les.rep.d||[]).slice(), until:les.rep.until||""}
                          : {t:"none", d:[], until:""},
    dur:   les ? nearestDur(mins(les.to||"17:30") - mins(les.from||"16:00")) : draft.dur
  };
  const ds = les ? les.date : (date || state.sel);
  const repeating = les && isRep(les);
  document.getElementById("sheettitle").textContent = les ? (repeating?"تعديل حصة متكرّرة":"تعديل الحصة") : "حصة جديدة";
  document.getElementById("sheetsub").textContent = repeating
    ? `تبدأ من ${longDate(ds)} · ${repLabel(les)} — التعديل يسري على كل المواعيد`
    : longDate(ds);
  document.getElementById("f-student").value = les ? (les.student||"") : "";
  document.getElementById("f-note").value    = les ? (les.note||"") : "";
  document.getElementById("f-date").value    = ds;
  document.getElementById("f-from").value    = les ? (les.from||"16:00") : "16:00";
  document.getElementById("f-del").hidden    = !les;
  document.getElementById("f-msg").hidden    = true;
  document.querySelector('label[for="f-date"]').textContent = repeating ? "تاريخ بداية التكرار" : "التاريخ";
  paintOpts();
  scrim.hidden = false;
  setTimeout(()=>document.getElementById("f-student").focus(), 50);
}
function closeSheet(){ scrim.hidden = true; state.editing=null; state.occDate=null; }
document.getElementById("f-cancel").onclick = closeSheet;
scrim.onclick = e => { if(e.target===scrim) closeSheet(); };
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if(!cscrim.hidden) closeConfirm(); else if(!scrim.hidden) closeSheet();
});

document.getElementById("f-save").onclick = ()=>{
  const msg = document.getElementById("f-msg");
  const student = document.getElementById("f-student").value.trim();
  const date = document.getElementById("f-date").value;
  const from = document.getElementById("f-from").value;
  const to   = addMin(from, draft.dur);
  const show = t => { msg.textContent = t; msg.hidden = false; };
  if(!student){ show("اكتب اسم الطالب."); document.getElementById("f-student").focus(); return; }
  if(!date){ show("اختر تاريخ الحصة."); return; }
  if(!from){ show("حدّد وقت البدء."); return; }

  const old = state.editing ? lessons.find(l=>l.id===state.editing) : null;
  const until = document.getElementById("f-until").value || "";
  let rep = {t:"none", d:[], until:""};
  if(draft.rep.t !== "none"){
    let days = draft.rep.d.slice();
    if(draft.rep.t==="weekly" && !days.length) days = [parse(date).getDay()];
    rep = {t:draft.rep.t, d:days, until};
  }
  const l = {
    id: old ? old.id : "l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    student, grade:draft.grade, subj:draft.subj, date, from, to,
    note: document.getElementById("f-note").value.trim(),
    done: (old && rep.t==="none") ? !!old.done : false,
    rep,
    doneOn: rep.t==="none" ? {} : (old && old.doneOn ? old.doneOn : {}),
    skip:   rep.t==="none" ? [] : (old && old.skip   ? old.skip   : []),
    stat:   old && old.stat ? old.stat : {},
    ts: old ? (old.ts||Date.now()) : Date.now()
  };
  state.sel = date;
  const d = parse(date); state.cur = {y:d.getFullYear(), m:d.getMonth()};
  closeSheet();
  putLesson(l);
};

document.getElementById("f-del").onclick = ()=>{
  const id = state.editing, ds = state.occDate;
  const l = lessons.find(x=>x.id===id);
  closeSheet();
  if(!l) return;
  if(isRep(l)){
    askConfirm({
      title:"حذف حصة متكرّرة",
      text:"هذه الحصة تتكرّر. اختر ما تريد حذفه — لا يمكن التراجع.",
      what:(l.student||"")+" — موعد "+longDate(ds)+" · "+fmtT(l.from),
      ok:"حذف السلسلة كلها",
      ok2:"حذف موعد "+longDate(ds)+" فقط",
      run: ()=>delLesson(id),
      run2: ()=>putLesson(Object.assign({}, l, {skip:(l.skip||[]).concat(ds)}))
    });
    return;
  }
  askConfirm({
    title:"حذف الحصة",
    text:"سيُحذف هذا الموعد نهائيًا.",
    what:(l.student||"")+" — "+longDate(l.date)+" · "+fmtT(l.from),
    ok:"حذف",
    run: ()=>delLesson(id)
  });
};
